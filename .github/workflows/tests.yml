name: tests

# Run the unit-test suite on every push to main and on every pull request that
# targets main, so a red suite blocks merges (see README "Testing & CI").
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the project's minimum supported runtime (the most likely place
        # a `X | Y`-at-runtime regression surfaces); 3.11/3.12 are mainstream.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=junit.xml

      - name: Upload coverage + test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
            junit.xml
          retention-days: 14

  # Aggregate gate: a single check named "tests" that branch protection can
  # require, instead of requiring each matrix leg individually.
  tests:
    name: tests
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Verify the test matrix succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more test matrix jobs failed."
            exit 1
          fi
          echo "All test matrix jobs passed."
